<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recolección de basura — Tañarandy 2026</title>

<style>
:root{
  --bg:#f7f9f7;
  --card:#ffffff;
  --text:#1b1b1b;
  --line:#e0e4e0;

  --green:#1f9d55;
  --orange:#ff9f1c;
  --red:#e63946;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:1200px;
  margin:16px auto 60px;
  padding:0 12px;
}

header{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

header h1{
  margin:0 0 4px;
  font-size:18px;
}

header p{
  margin:0;
  font-size:13px;
  color:#555;
}

.month{
  margin-top:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}

.month-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.month-header img{
  height:48px;
}

.month-header h2{
  margin:0;
  font-size:16px;
  color:var(--orange);
  flex:1;
}

.badge{
  border:1px solid var(--orange);
  color:var(--orange);
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  white-space:nowrap;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:10px 0;
}

button{
  cursor:pointer;
  padding:7px 12px;
  border-radius:8px;
  border:1px solid;
  font-weight:700;
  font-size:13px;
}

.add{
  background:#e8f7ef;
  color:var(--green);
  border-color:var(--green);
}

.clear{
  background:#fff2e0;
  color:var(--orange);
  border-color:var(--orange);
}

.del{
  background:#fdecec;
  color:var(--red);
  border-color:var(--red);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

thead th{
  text-align:left;
  font-size:13px;
  padding:8px;
  border-bottom:2px solid var(--line);
}

td{
  padding:8px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

input[type="text"]{
  width:100%;
  min-width:160px;
  padding:7px;
  border-radius:6px;
  border:1px solid var(--line);
}

.state{
  display:flex;
  gap:10px;
  white-space:nowrap;
}

.state label{
  font-size:13px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-top:14px;
}

.stat{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .k{font-size:12px;color:#666}
.stat .v{font-size:16px;font-weight:900}
</style>
</head>

<body>
<div class="wrap">

<header>
  <h1>Listado de recolección de basura — Tañarandy — 2026</h1>
  <p>Monto mensual: <b>10.000 GS</b> por usuario</p>
</header>

<div id="months"></div>

<p style="text-align:center;font-size:12px;color:#666;margin-top:16px">
  Datos sincronizados en la nube
</p>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBsvbFZhPNDRJDCJzIuFQGZ25HCPY",
  authDomain: "basura-tanarandy-2026.firebaseapp.com",
  projectId: "basura-tanarandy-2026"
});
const db = firebase.firestore();
</script>

<script>
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MONTO = 10000;
let data = {};

async function saveData(){
  await db.collection("basura").doc("2026").set(data);
}

function render(){
  const root = document.getElementById("months");
  root.innerHTML = "";

  MESES.forEach((mes,i)=>{
    if(!data[i]) data[i]=[];
    const users = data[i];

    const pagados = users.filter(u=>u.estado==="pagado").length;
    const adeudados = users.length - pagados;

    const div = document.createElement("div");
    div.className="month";
    div.innerHTML=`
      <div class="month-header">
        <img src="logo.png" alt="Logonto mensual: 10.000 GS</span>
      </div>

      <div class="actions">
        <button class="add">+ Agregar usuario</button>
        <button class="clear">Limpiar mes</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Monto</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="summary">
        <div class="stat"><div class="k">Usuarios</div><div class="v">${users.length}</div></div>
        <div class="stat"><div class="k">Pagados</div><div class="v">${pagados}</div></div>
        <div class="stat"><div class="k">Adeudados</div><div class="v">${adeudados}</div></div>
        <div class="stat"><div class="k">Total pagado</div><div class="v">${pagados*MONTO} GS</div></div>
        <div class="stat"><div class="k">Total sin pagar</div><div class="v">${adeudados*MONTO} GS</div></div>
      </div>
    `;

    const tbody = div.querySelector("tbody");

    users.forEach((u,idx)=>{
      const tr = document.createElement("tr");
      tr.innerHTML=`
        <td><input value="${u.nombre||""}"></td>
        <td><input value="${u.tel||""}"></td>
        <td class="state">
          <label><input type="radio" name="e${i}-${idx}" ${u.estado==="pagado"?"checked":""}> Pagado</label>
          <label><input type="radio" name="e${i}-${idx}" ${u.estado!=="pagado"?"checked":""}> Deuda</label>
        </td>
        <td>10.000 GS</td>
        <td><button class="del">Eliminar</button></td>
      `;

      const inputs = tr.querySelectorAll("input");
      inputs[0].oninput = async e=>{u.nombre=e.target.value; await saveData();}
      inputs[1].oninput = async e=>{u.tel=e.target.value; await saveData();}
      inputs[2].onclick = inputs[3].onclick = async()=>{
        u.estado = inputs[2].checked ? "pagado" : "deuda";
        await saveData();
      };

      tr.querySelector(".del").onclick = async()=>{
        users.splice(idx,1);
        await saveData();
      };

      tbody.appendChild(tr);
    });

    div.querySelector(".add").onclick = async()=>{
      users.push({nombre:"",tel:"",estado:"deuda"});
      await saveData();
    };

    div.querySelector(".clear").onclick = async()=>{
      if(confirm("¿Borrar todo el mes de "+mes+"?")){
        data[i]=[];
        await saveData();
      }
    };

    root.appendChild(div);
  });
}

db.collection("basura").doc("2026").onSnapshot(doc=>{
  if(doc.exists){
    data = doc.data();
    render();
  }
});
</script>

</body>
</html>
``
