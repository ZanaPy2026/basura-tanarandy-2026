<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recolección de basura — Tañarandy 2026</title>

<style>
:root{
  --bg:#0b1220;
  --card:#121b2f;
  --muted:#95a3c7;
  --text:#e8efff;
  --line:#263252;
  --accent:#4da3ff;
  --good:#2ecc71;
  --bad:#ff5a6b;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:linear-gradient(180deg,#070c18,var(--bg));
  color:var(--text);
}

.wrap{
  max-width:1200px;
  margin:18px auto 60px;
  padding:0 14px;
}

header{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  text-align:center;
}

header h1{
  margin:0 0 6px;
  font-size:18px;
}

header p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

.month{
  margin-top:16px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
}

.month h2{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  font-size:15px;
  margin:0 0 10px;
}

.badge{
  border:1px solid var(--accent);
  color:var(--accent);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

button{
  cursor:pointer;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid;
  font-weight:700;
  font-size:13px;
}

.add{background:#1a2b4d;color:var(--accent);border-color:var(--accent)}
.clear{background:#2a2a2a;color:var(--muted);border-color:#444}
.del{background:#35161b;color:#ff9aa3;border-color:var(--bad)}

.table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.table-wrap table{
  width:100%;
  min-width:900px; /* fuerza scroll en celular */
  border-collapse:collapse;
}

thead th{
  text-align:left;
  font-size:13px;
  padding:8px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  padding:8px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  white-space:nowrap;
}

input[type="text"]{
  width:100%;
  min-width:160px;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0a1224;
  color:var(--text);
}

.state{
  display:flex;
  gap:10px;
  white-space:nowrap;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-top:12px;
}

.stat{
  background:#090e1c;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:900}
</style>
</head>

<body>
<div class="wrap">

<header>
  <h1>Listado de recolección de basura — Tañarandy — 2026</h1>
  <p>Monto mensual: <b>10.000 GS</b> por usuario</p>
</header>

<div id="months"></div>

<p style="text-align:center;font-size:12px;color:var(--muted);margin-top:16px">
  Datos sincronizados en la nube (Firebase)
</p>

</div>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBsvbFZhPNDRJDCJzIuFQGZ25HCPY",
  authDomain: "basura-tanarandy-2026.firebaseapp.com",
  projectId: "basura-tanarandy-2026"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script>
const MONTO = 10000;
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let data = {};

async function saveData(){
  await db.collection("basura").doc("2026").set(data);
}

function render(){
  const root = document.getElementById("months");
  root.innerHTML = "";

  MESES.forEach((mes,i)=>{
    if(!data[i]) data[i]=[];
    const users = data[i];

    const pagados = users.filter(u=>u.estado==="pagado").length;
    const adeudados = users.length - pagados;

    const div = document.createElement("div");
    div.className="month";
    div.innerHTML=`
      <h2>${mes}<span class="badge">Monto mensual: 10.000 GS</span></h2>
      <div class="actions">
        <button class="add">+ Agregar usuario</button>
        <button class="clear">Limpiar mes</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Monto</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="summary">
        <div class="stat"><div class="k">Usuarios</div><div class="v">${users.length}</div></div>
        <div class="stat"><div class="k">Pagados</div><div class="v">${pagados}</div></div>
        <div class="stat"><div class="k">Adeudados</div><div class="v">${adeudados}</div></div>
        <div class="stat"><div class="k">Total pagado</div><div class="v">${pagados*MONTO} GS</div></div>
        <div class="stat"><div class="k">Total sin pagar</div><div class="v">${adeudados*MONTO} GS</div></div>
      </div>
    `;

    const tbody = div.querySelector("tbody");

    users.forEach((u,idx)=>{
      const tr = document.createElement("tr");
      tr.innerHTML=`
        <td><input value="${u.nombre||""}"></td>
        <td><input value="${u.tel||""}"></td>
        <td class="state">
          <label><input type="radio" name="e${i}-${idx}" ${u.estado==="pagado"?"checked":""}> Pagado</label>
          <label><input type="radio" name="e${i}-${idx}" ${u.estado!=="pagado"?"checked":""}> Deuda</label>
        </td>
        <td>10.000 GS</td>
        <td><button class="del">Eliminar</button></td>
      `;

      const inputs = tr.querySelectorAll("input");

      inputs[0].oninput = async e=>{u.nombre=e.target.value; await saveData();}
      inputs[1].oninput = async e=>{u.tel=e.target.value; await saveData();}
      inputs[2].onclick = inputs[3].onclick = async ()=>{
        u.estado = inputs[2].checked ? "pagado" : "deuda";
        await saveData();
      };

      tr.querySelector(".del").onclick = async ()=>{
        users.splice(idx,1);
        await saveData();
      };

      tbody.appendChild(tr);
    });

    div.querySelector(".add").onclick = async ()=>{
      users.push({nombre:"",tel:"",estado:"deuda"});
      await saveData();
    };

    div.querySelector(".clear").onclick = async ()=>{
      if(confirm("¿Borrar todo el mes de "+mes+"?")){
        data[i]=[];
        await saveData();
      }
    };

    root.appendChild(div);
  });
}

db.collection("basura").doc("2026").onSnapshot(doc=>{
  if(doc.exists){
    data = doc.data();
    render();
  }
});
</script>

</body>
</html>
