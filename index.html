<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recolección de basura – Tañarandy 2026</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f6f8f6;
}
.container{
  max-width:1100px;
  margin:20px auto;
  padding:10px;
  background:#fff;
  border-radius:10px;
}
h1{
  text-align:center;
  margin:0;
}
.month{
  margin-top:20px;
  border-top:1px solid #ddd;
  padding-top:15px;
}
.month-header{
  display:flex;
  align-items:center;
  gap:10px;
}
.month-header img{
  height:40px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th, td{
  border-bottom:1px solid #ddd;
  padding:6px;
  text-align:left;
}
input{
  width:100%;
  padding:5px;
}
button{
  padding:5px 10px;
  cursor:pointer;
}
.total{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">
  <h1>Listado de recolección de basura – Tañarandy 2026</h1>
  <p style="text-align:center">Monto mensual: <b>15.000 Gs</b></p>

  <div class="month">
    <div class="month-header">
      <img src="logo.png" alt="logo
      <button onclick="addUser()">Agregar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Monto</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <div class="total">
      Total: <span id="total">0</span> Gs
    </div>
  </div>
</div>

<!-- ✅ Firebase CORRECTO -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.jsript src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBsvbFZhPNDRJDCJzIuFQGZ25HCPY",
  authDomain: "basura-tanarandy-2026.firebaseapp.com",
  projectId: "basura-tanarandy-2026"
});

const db = firebase.firestore();
const ref = db.collection("basura").doc("2026");
const MONTO = 15000;
</script>

<script>
function format(n){
  return n.toLocaleString("es-PY");
}

function render(data){
  const tbody = document.getElementById("list");
  const totalEl = document.getElementById("total");
  tbody.innerHTML = "";
  let total = 0;

  (data.enero || []).forEach((u, i)=>{
    total += u.monto;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input value="${u.nombre}" onblur="updateName(${i}, this.value)"></td>
      <td>${format(u.monto)}</td>
      <td><button onclick="removeUser(${i})">X</button></td>
    `;
    tbody.appendChild(tr);
  });

  totalEl.textContent = format(total);
}

function addUser(){
  ref.get().then(d=>{
    const data = d.exists ? d.data() : {};
    const arr = data.enero || [];
    arr.push({ nombre:"", monto: MONTO });
    ref.set({ enero: arr });
  });
}

function updateName(i, value){
  ref.get().then(d=>{
    const data = d.data();
    data.enero[i].nombre = value;
    ref.set(data);
  });
}

function removeUser(i){
  ref.get().then(d=>{
    const data = d.data();
    data.enero.splice(i,1);
    ref.set(data);
  });
}

ref.onSnapshot(doc=>{
  if(doc.exists){
    render(doc.data());
  }else{
    ref.set({ enero: [] });
  }
});
</script>
</body>
</html>
