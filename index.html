<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1"/>  
  <title>Listado de recolección de basura compañía Tañarandy — Año 2026</title>  

  <style>  
    :root{  
      --bg:#0b1220;  
      --card:#121b2f;  
      --muted:#95a3c7;  
      --text:#e8efff;  
      --line:#263252;  
      --accent:#4da3ff;  
      --good:#2ecc71;  
      --bad:#ff5a6b;  
      --radius:14px;  
      --shadow: 0 10px 40px rgba(0,0,0,.25);  
    }  

    *{ box-sizing:border-box; }  

    body{  
      margin:0;  
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;  
      background: linear-gradient(180deg, #070c18, var(--bg));  
      color:var(--text);  
      line-height: 1.25;  
    }  

    .wrap{  
      max-width:1100px;  
      margin: 18px auto 60px;  
      padding: 0 14px;  
    }  

    header{  
      background: rgba(18,27,47,.78);  
      border:1px solid rgba(38,50,82,.95);  
      border-radius: var(--radius);  
      padding: 16px 14px;  
      box-shadow: var(--shadow);  
    }  

    header h1{  
      margin:0 0 6px;  
      font-size: 18px;  
      letter-spacing:.2px;  
      text-align:center;  
    }  

    header p{  
      margin:0;  
      text-align:center;  
      color:var(--muted);  
      font-size: 13px;  
    }  

    .month{  
      margin-top:14px;  
      background: rgba(18,27,47,.78);  
      border:1px solid rgba(38,50,82,.95);  
      border-radius: var(--radius);  
      padding: 12px;  
      overflow:hidden;  
    }  

    .month h2{  
      margin:0 0 10px;  
      font-size: 15px;  
      color: var(--text);  
      display:flex;  
      align-items:center;  
      justify-content:space-between;  
      gap:10px;  
      flex-wrap:wrap;  
    }  

    .badge{  
      border:1px solid rgba(77,163,255,.45);  
      color:var(--accent);  
      padding:6px 10px;  
      border-radius:999px;  
      font-size: 12px;  
      white-space:nowrap;  
    }  

    .actions{  
      display:flex;  
      gap:10px;  
      align-items:center;  
      justify-content:space-between;  
      flex-wrap:wrap;  
      margin: 10px 0 10px;  
    }  

    .btn{  
      cursor:pointer;  
      background: rgba(77,163,255,.14);  
      border:1px solid rgba(77,163,255,.35);  
      color: var(--accent);  
      padding: 10px 12px;  
      border-radius: 10px;  
      font-weight: 800;  
      font-size: 13px;  
      flex: 1 1 auto;  
      min-width: 190px;  
      user-select:none;  
    }  
    .btn.secondary{  
      background: rgba(149,163,199,.12);  
      border:1px solid rgba(149,163,199,.25);  
      color: var(--muted);  
      min-width: 150px;  
    }  
    .btn.danger{  
      background: rgba(255,90,107,.10);  
      border:1px solid rgba(255,90,107,.30);  
      color: #ff9aa3;  
      min-width: 0;  
      width: 100%;  
    }  

    table{  
      width:100%;  
      border-collapse: collapse;  
      border-radius: 10px;  
      border:1px solid var(--line);  
      background: rgba(9,14,28,.35);  
      overflow:hidden;  
    }  

    thead th{  
      background: rgba(18,27,47,.97);
