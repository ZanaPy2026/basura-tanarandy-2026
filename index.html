<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basura Tañarandy 2026</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  margin:0;
}
.box{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:15px;
  border-radius:8px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th, td{
  border-bottom:1px solid #ccc;
  padding:6px;
}
button{
  padding:5px 10px;
}
</style>
</head>

<body>
<div class="box">
  <h2>Listado de recolección de basura – Tañarandy 2026</h2>
  <p>Monto mensual: <b>15.000 Gs</b></p>

  <button id="add">Agregar</button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Monto</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <p><b>Total:</b> <span id="total">0</span> Gs</p>
</div>

<!-- ✅ FIREBASE (CORRECTO, LOS DOS) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBsvbFZhPNDRJDCJzIuFQGZ25HCPY",
  authDomain: "basura-tanarandy-2026.firebaseapp.com",
  projectId: "basura-tanarandy-2026"
});

const db = firebase.firestore();
const ref = db.collection("basura").doc("2026");
const MONTO = 15000;
</script>

<script>
const tbody = document.getElementById("lista");
const totalEl = document.getElementById("total");

function render(data){
  tbody.innerHTML = "";
  let total = 0;

  (data.enero || []).forEach((u, i)=>{
    total += u.monto;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input value="${u.nombre || ""}"
                 onchange="editName(${i}, this.value)"></td>
      <td>${u.monto}</td>
      <td><button onclick="del(${i})">X</button></td>
    `;
    tbody.appendChild(tr);
  });

  totalEl.textContent = total;
}

function add(){
  ref.get().then(d=>{
    const data = d.exists ? d.data() : {enero:[]};
    data.enero.push({nombre:"", monto: MONTO});
    ref.set(data);
  });
}

function editName(i, val){
  ref.get().then(d=>{
    const data = d.data();
    data.enero[i].nombre = val;
    ref.set(data);
  });
}

function del(i){
  ref.get().then(d=>{
    const data = d.data();
    data.enero.splice(i,1);
    ref.set(data);
  });
}

document.getElementById("add").onclick = add;

ref.onSnapshot(doc=>{
  if(doc.exists){
    render(doc.data());
  }else{
    ref.set({enero:[]});
  }
});
</script>
</body>
</html>
