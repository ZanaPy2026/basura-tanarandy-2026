<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recolección de Basura – Tañarandy 2026</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#121b2f;
      --muted:#95a3c7;
      --text:#e8efff;
      --line:#263252;
      --accent:#4da3ff;
      --good:#2ecc71;
      --bad:#ff5a6b;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,Segoe UI,Arial;
      background:linear-gradient(180deg,#070c18,var(--bg));
      color:var(--text);
    }
    .wrap{
      max-width:1100px;
      margin:18px auto 60px;
      padding:0 14px;
    }
    header{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      text-align:center;
    }
    header h1{margin:0 0 6px;font-size:18px}
    header p{margin:0;font-size:13px;color:var(--muted)}

    .month{
      margin-top:16px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:12px;
    }
    .month h2{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      font-size:15px;
      margin:0 0 10px;
    }
    .badge{
      border:1px solid var(--accent);
      color:var(--accent);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .btn{
      cursor:pointer;
      padding:10px;
      border-radius:10px;
      border:1px solid;
      font-weight:700;
      font-size:13px;
    }
    .btn.add{background:#1a2b4d;color:var(--accent);border-color:var(--accent)}
    .btn.clear{background:#2a2a2a;color:var(--muted);border-color:#444}
    .btn.del{background:#35161b;color:#ff9aa3;border-color:var(--bad);width:100%}

    table{
      width:100%;
      border-collapse:collapse;
    }
    thead th{
      text-align:left;
      font-size:13px;
      padding:8px;
      border-bottom:1px solid var(--line);
    }
    td{
      padding:8px;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }
    input[type="text"]{
      width:100%;
      padding:8px;
      border-radius:8px;
      border:1px solid var(--line);
      background:#0a1224;
      color:var(--text);
    }
    .state{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .summary{
      display:grid;
      grid-template-columns:repeat(5,minmax(120px,1fr));
      gap:10px;
      margin-top:12px;
    }
    .stat{
      background:#090e1c;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
    }
    .stat .k{font-size:12px;color:var(--muted)}
    .stat .v{font-size:16px;font-weight:900}

    @media(max-width:560px){
      thead{display:none}
      table,tbody,tr,td{display:block;width:100%}
      tr{margin-bottom:10px}
      td::before{
        content:attr(data-label);
        display:block;
        font-size:12px;
        color:var(--muted);
        margin-bottom:4px;
        font-weight:700;
      }
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Listado de recolección de basura — Tañarandy — 2026</h1>
    <p>Monto mensual: <b>10.000 GS</b> por usuario</p>
  </header>

  <div id="months"></div>

  <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:16px">
    Los datos se guardan en este navegador.
  </p>
</div>

<script>
const MONTO = 10000;
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const KEY = "basura-tanarandy-2026";

function loadData(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch{ return {}; }
}
function saveData(d){ localStorage.setItem(KEY,JSON.stringify(d)); }
const data = loadData();

function render(){
  const cont = document.getElementById("months");
  cont.innerHTML = "";

  MESES.forEach((mes,i)=>{
    if(!data[i]) data[i]=[];
    const users = data[i];
    const pagados = users.filter(u=>u.estado==="pagado").length;

    const div = document.createElement("div");
    div.className="month";
    div.innerHTML=`
      <h2>${mes} <span class="badge">Monto mensual: 10.000 GS</span></h2>
      <div class="actions">
        <button class="btn add">+ Agregar usuario</button>
        <button class="btn clear">Limpiar mes</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Monto</th><th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="summary">
        <div class="stat"><div class="k">Usuarios</div><div class="v">${users.length}</div></div>
        <div class="stat"><div class="k">Pagados</div><div class="v">${pagados}</div></div>
        <div class="stat"><div class="k">Adeudados</div><div class="v">${users.length-pagados}</div></div>
        <div class="stat"><div class="k">Total pagado</div><div class="v">${pagados*MONTO} GS</div></div>
        <div class="stat"><div class="k">Total sin pagar</div><div class="v">${(users.length-pagados)*MONTO} GS</div></div>
      </div>
    `;
    const tbody = div.querySelector("tbody");

    users.forEach((u,idx)=>{
      const tr = document.createElement("tr");
      tr.innerHTML=`
        <td data-label="Nombre"><input value="${u.nombre||""}"></td>
        <td data-label="Teléfono"><input value="${u.tel||""}"></td>
        <td data-label="Estado" class="state">
          <label><input type="radio" name="e${i}-${idx}" ${u.estado==="pagado"?"checked":""}> Pagado</label>
          <label><input type="radio" name="e${i}-${idx}" ${u.estado==="deuda"?"checked":""}> Deuda</label>
        </td>
        <td data-label="Monto">10.000 GS</td>
        <td><button class="btn del">Eliminar</button></td>
      `;
      const inputs = tr.querySelectorAll("input");
      inputs[0].oninput=e=>{u.nombre=e.target.value;saveData(data)};
      inputs[1].oninput=e=>{u.tel=e.target.value;saveData(data)};
      inputs[2].onclick=()=>{u.estado="pagado";saveData(data);render()}
      inputs[3].onclick=()=>{u.estado="deuda";saveData(data);render()}
      tr.querySelector("button").onclick=()=>{users.splice(idx,1);saveData(data);render()}
      tbody.appendChild(tr);
    });

    div.querySelector(".add").onclick=()=>{
      users.push({nombre:"",tel:"",estado:"deuda"});
      saveData(data);render();
    }
    div.querySelector(".clear").onclick=()=>{
      if(confirm("¿Borrar todos los usuarios de "+mes+"?")){
        data[i]=[];saveData(data);render();
      }
    }
    cont.appendChild(div);
  });
}
render();
</script>
</body>
</html>
