<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
  <title>Listado de recolección de basura — Compañía Tañarandy — Año 2026</title>  

  <style>  
    :root{  
      --bg:#0b1220;  
      --card:#121b2f;  
      --muted:#95a3c7;  
      --text:#e8efff;  
      --line:#263252;  
      --accent:#4da3ff;  
      --good:#2ecc71;  
      --bad:#ff5a6b;  
      --radius:14px;  
      --shadow: 0 10px 40px rgba(0,0,0,.25);  
    }  

    *{ box-sizing:border-box; }  
    body{  
      margin:0;  
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;  
      background: linear-gradient(180deg, #070c18, var(--bg));  
      color:var(--text);  
      line-height: 1.25;  
    }  

    .wrap{  
      max-width:1100px;  
      margin: 18px auto 60px;  
      padding: 0 14px;  
    }  

    header{  
      background: rgba(18,27,47,.78);  
      border:1px solid rgba(38,50,82,.95);  
      border-radius: var(--radius);  
      padding: 16px 14px;  
      box-shadow: var(--shadow);  
    }  

    header h1{  
      margin:0 0 6px;  
      font-size: 18px;  
      letter-spacing:.2px;  
      text-align:center;  
    }  

    header p{  
      margin:0;  
      text-align:center;  
      color:var(--muted);  
      font-size: 13px;  
    }  

    .month{  
      margin-top:14px;  
      background: rgba(18,27,47,.78);  
      border:1px solid rgba(38,50,82,.95);  
      border-radius: var(--radius);  
      padding: 12px;  
      overflow:hidden;  
    }  

    .month h2{  
      margin:0 0 10px;  
      font-size: 15px;  
      color: var(--text);  
      display:flex;  
      align-items:center;  
      justify-content:space-between;  
      gap:10px;  
      flex-wrap:wrap;  
    }  

    .badge{  
      border:1px solid rgba(77,163,255,.45);  
      color:var(--accent);  
      padding:6px 10px;  
      border-radius:999px;  
      font-size: 12px;  
      white-space:nowrap;  
    }  

    .controls{  
      display:flex;  
      gap:10px;  
      align-items:center;  
      justify-content:space-between;  
      flex-wrap:wrap;  
      margin: 10px 0 10px;  
    }  

    .field{  
      flex: 1 1 auto;  
      min-width: 220px;  
    }  

    input[type="text"]{  
      width:100%;  
      border-radius: 10px;  
      border: 1px solid rgba(38,50,82,.9);  
      background: rgba(7,12,24,.45);  
      color: var(--text);  
      padding: 10px 10px;  
      outline: none;  
      font-size: 13px;  
    }  
    input[type="text"]::placeholder{ color: rgba(149,163,199,.8); }  

    .btn{  
      cursor:pointer;  
      background: rgba(77,163,255,.14);  
      border:1px solid rgba(77,163,255,.35);  
      color: var(--accent);  
      padding: 10px 12px;  
      border-radius: 10px;  
      font-weight: 900;  
      font-size: 13px;  
      flex: 0 0 auto;  
      min-width: 190px;  
      user-select:none;  
    }  
    .btn.secondary{  
      background: rgba(149,163,199,.12);  
      border:1px solid rgba(149,163,199,.25);  
      color: var(--muted);  
      min-width: 150px;  
    }  
    .btn.danger{  
      background: rgba(255,90,107,.10);  
      border:1px solid rgba(255,90,107,.30);  
      color: #ff9aa3;  
      min-width: 0;  
      width: 100%;  
    }  

    table{  
      width:100%;  
      border-collapse: collapse;  
      border-radius: 10px;  
      border:1px solid var(--line);  
      background: rgba(9,14,28,.35);  
      overflow:hidden;  
    }  

    thead th{  
      background: rgba(18,27,47,.97);  
      border-bottom:1px solid var(--line);  
      text-align:left;  
      padding: 10px 8px;  
      font-size: 13px;  
      position: sticky;  
      top: 0;  
      z-index: 1;  
    }  

    td{  
      padding: 10px 8px;  
      border-bottom:1px solid var(--line);  
      font-size: 13px;  
      vertical-align:middle;  
      text-align:left;  
    }  

    .stateWrap{  
      display:flex;  
      flex-direction:column;  
      gap:8px;  
      min-width: 190px;  
    }  

    .radioRow{  
      display:flex;  
      align-items:center;  
      gap:10px;  
      flex-wrap:wrap;  
      font-weight:800;  
      white-space:nowrap;  
    }  

    .radioRow label{  
      display:flex;  
      align-items:center;  
      gap:8px;  
      cursor:pointer;  
      color: var(--text);  
    }  

    .summary{  
      display:grid;  
      grid-template-columns: repeat(5, minmax(150px, 1fr));  
      gap:10px;  
      margin: 12px 0 2px;  
    }  

    .stat{  
      border:1px solid var(--line);  
      background: rgba(9,14,28,.25);  
      border-radius: 12px;  
      padding: 10px 12px;  
      min-height: 64px;  
    }  

    .stat .k{  
      color: var(--muted);  
      font-size: 12px;  
    }  
    .stat .v{  
      font-size: 16px;  
      font-weight: 1000;  
      margin-top: 4px;  
      word-break: break-word;  
    }  

    .footnote{  
      color: var(--muted);  
      font-size: 12px;  
      text-align:center;  
      margin-top:14px;  
    }  

    /* Responsive: tablets */  
    @media (max-width: 900px){  
      .summary{ grid-template-columns: repeat(2, minmax(150px, 1fr)); }  
      header h1{ font-size: 17px; }  
      .btn{ min-width: 140px; }  
    }  

    /* Responsive: mobile table as cards */  
    @media (max-width: 560px){  
      thead{ display:none; }  
      table, tbody, tr, td{  
        display:block;  
        width:100%;  
      }  

      tr{  
        border-bottom: 1px solid var(--line);  
        padding: 10px 0;  
      }  

      td{  
        border-bottom:none;  
        padding: 6px 0;  
      }  

      td[data-label]::before{  
        content: attr(data-label);  
        display:block;  
        color: var(--muted);  
        font-weight: 900;  
        font-size: 12px;  
        margin-bottom: 6px;  
      }  

      .stateWrap{ min-width: 0; }  
      .radioRow{ white-space: normal; }  
    }  
  </style>  
</head>  

<body>  
  <div class="wrap">

      <p>Monto mensual por usuario: <b>10.000 GS</b>. Los totales se calculan automáticamente.</p>  
    </header>  

    <div id="appMount"></div>  

    <div class="footnote">  
      Se guarda en tu navegador (localStorage). Si borrás datos del navegador, se pierde el registro.  
    </div>  
  </div>  

  <script>  
    const MONTO_MENSUAL = 10000; // GS  
    const MESES = [  
      "Enero","Febrero","Marzo","Abril","Mayo","Junio",  
      "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"  
    ];  

    const STORAGE_KEY = "basura_tanarandy_2026_v2";  

    const $ = (sel, root=document) => root.querySelector(sel);  

    // Estado base:  
    // {  
    //   users: ["Nombre1", "Nombre2"],  
    //   months: {  
    //     "Enero": { "Nombre1": "PAGADO|IMPAGO|ADELANTO|..." }  
    //   }  
    // }  
    const defaultState = () => ({  
      users: [],  
      months: {}  
    });  

    function loadState(){  
      try{  
        const raw = localStorage.getItem(STORAGE_KEY);  
        if(!raw) return defaultState();  
        const parsed = JSON.parse(raw);  
        // sane defaults  
        parsed.users ||= [];  
        parsed.months ||= {};  
        return parsed;  
      }catch{  
        return defaultState();  
      }  
    }  

    function saveState(state){  
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));  
    }  

    function fmtGS(n){  
      try{  
        return new Intl.NumberFormat("es-PY").format(n) + " GS";  
      }catch{  
        return n + " GS";  
      }  
    }

    // - "PAGADO": paga completa  
    // - "PENDIENTE": no pagó  
    // - "EXENTO": no aplica (ej. no corresponde)  
    const ESTADOS = [  
      { key: "PAGADO", label: "Pagado" },  
      { key: "PENDIENTE", label: "Pendiente" },  
      { key: "EXENTO", label: "Exento" }  
    ];  

    function getMonthState(state, month){  
      state.months[month] ||= {};  
      return state.months[month];  
    }  

    function ensureUsers(state){  
      // Si no hay usuarios, creamos 2 ejemplos para que puedas ver  
      // (vos los borrás o editás)  
      if(state.users.length === 0){  
        state.users = ["Usuario 1", "Usuario 2"];  
      }  
    }  

    function calcularTotales(state, month){  
      const m = getMonthState(state, month);  
      let pagados = 0;  
      let pendientes = 0;  
      let exentos = 0;  

      for(const u of state.users){  
        const st = m[u] || "PENDIENTE";  
        if(st === "PAGADO") pagados++;  
        else if(st === "EXENTO") exentos++;  
        else pendientes++;  
      }  

      const totalRecaudado = pagados * MONTO_MENSUAL;  
      const totalPendiente = pendientes * MONTO_MENSUAL;  

      return { pagados, pendientes, exentos, totalRecaudado, totalPendiente };  
    }

      ensureUsers(state);  
      saveState(state);

      mount.innerHTML = "";
